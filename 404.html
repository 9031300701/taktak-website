<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taktakchat — Join me</title>
<link rel="icon" href="/favicon.png">
<style>
  :root{--bg:#1b0f2e;--card:#2a1846;--txt:#fff;--sub:#cbb9ec;--btn:#ff7a1a}
  *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#5b2a9b,var(--bg) 70%);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .c{max-width:380px;width:100%;text-align:center;background:var(--card);border-radius:24px;padding:28px 20px;box-shadow:0 20px 60px #0008}
  img{width:96px;height:96px}h1{font-size:22px;margin:12px 0 6px}p{color:var(--sub);margin:0 0 20px;line-height:1.5}
  a.b{display:block;background:linear-gradient(90deg,#ff5f6d,var(--btn));color:#fff;text-decoration:none;font-weight:700;padding:14px;border-radius:999px;font-size:17px}
  .id{margin-top:14px;font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<div class="c" id="box">
  <img src="/img/owl.png" alt="">
  <h1>Your friend invited you to Taktakchat</h1>
  <p>Voice rooms, games and new friends. Download the app and sign up — you both get rewards.</p>
  <a class="b" id="dl" href="https://play.google.com/store/apps/details?id=com.taktakchat.app">Download Taktakchat</a>
  <div class="id" id="who"></div>
</div>
<script>
// INVITE_V1: taktakchat.com/i/<TaktakID>[?t=<templateId>] — every user has their own link.
(function(){
  var m = location.pathname.match(/^\/i\/([0-9A-Za-z]{1,12})\/?$/);
  if (!m) { document.getElementById('box').innerHTML = '<h1>Page not found</h1><p><a class="b" href="/">Go to Taktakchat</a></p>'; return; }
  var code = m[1], tpl = new URLSearchParams(location.search).get('t') || '';
  var api = 'https://api.taktakchat.com/api/v1/invite/click';
  function ping(kind){ try{ var b = new URLSearchParams({code:code,tpl:tpl,kind:kind}); if(!navigator.sendBeacon(api,b)) fetch(api,{method:'POST',body:b,mode:'no-cors',keepalive:true}); }catch(e){} }
  ping('click');
  document.getElementById('who').textContent = 'Invite ID: ' + code;
  var play = 'https://play.google.com/store/apps/details?id=com.taktakchat.app&referrer=' + encodeURIComponent('ref=' + code + (tpl ? '&tpl=' + tpl : ''));
  var a = document.getElementById('dl'); a.href = play;
  a.addEventListener('click', function(){ ping('download'); });
})();
</script>
</body>
</html>
